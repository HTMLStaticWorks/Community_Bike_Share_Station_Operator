<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CycleFlow</title>
  <meta name="description" content="Log in to CycleFlow to unlock bikes and manage your rides and membership.">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

  <div class="auth-topbar">
    <a href="index.html" class="auth-back"><i data-lucide="arrow-left"></i> Back to home</a>
    <div class="auth-toggles">
      <button class="icon-btn theme-toggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn rtl-toggle" aria-label="Toggle RTL"><i data-lucide="arrow-left-right"></i></button>
    </div>
  </div>

  <main class="auth-card animate-fade-up">
    <a href="index.html" class="auth-logo" aria-label="CycleFlow home">
      <i data-lucide="bike"></i> CycleFlow
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to unlock bikes and manage your rides &amp; membership</p>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-control" autocomplete="email" required>
        <div class="error-message" id="emailError">Please enter a valid email.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="field-wrap">
          <input type="password" id="password" class="form-control" autocomplete="current-password" required>
          <button type="button" class="pwd-toggle" data-target="password" aria-label="Show password"><i data-lucide="eye"></i></button>
        </div>
        <div class="error-message" id="pwdError">Password must be at least 8 characters.</div>
      </div>

      <div class="auth-row">
        <label class="auth-check"><input type="checkbox" id="remember"> Remember me</label>
        <a href="#" class="auth-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-auth">Login to account</button>
    </form>

    <div class="auth-divider">OR</div>

    <!-- Google Identity Services SDK here -->
    <button type="button" class="social-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <!-- Sign in with Apple JS here -->
    <button type="button" class="social-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16.365 1.43c-1.392.062-2.923.946-3.87 1.944-.805.85-1.503 2.103-1.282 3.313 1.542.09 2.924-.814 3.826-1.787.794-.856 1.408-2.128 1.326-3.47zM20.25 15.65c-.156.417-.348.86-.593 1.306-1.127 2.058-2.316 4.123-4.593 4.168-1.07.02-1.787-.638-3.078-.638-1.29 0-2.06.61-3.097.653-2.324.092-3.692-2.247-4.838-4.307C1.725 12.635 1.777 7.73 4.16 5.386c1.155-1.134 2.707-1.854 4.318-1.884 2.18-.044 3.655 1.436 4.796 1.436 1.143 0 2.935-1.688 5.38-1.468 1.026.046 3.036.386 4.323 2.213-3.472 2.03-2.956 7.158.468 8.653-.263.673-.556 1.32-.88 1.954z" fill="currentColor"/></svg>
      Continue with Apple
    </button>

    <p class="auth-foot">Don't have an account? <a href="register.html" class="auth-link">Register here</a></p>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
